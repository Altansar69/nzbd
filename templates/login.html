{% extends "base.html" %}
{% block content %}
<section class="card narrow">
<h1>Sign in</h1>
{% if let Some(n) = notice %}<p class="alert" role="alert">{{ n }}</p>
{% endif %}<form method="post" action="/login" autocomplete="on">
<input type="hidden" name="login_token" value="{{ login_token }}">
<p><label for="username">Username</label><br>
<input id="username" name="username" type="text" value="{{ username }}" maxlength="64" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus></p>
<p><label for="password">Password</label><br>
<input id="password" name="password" type="password" maxlength="256" autocomplete="current-password" required></p>
<p><button type="submit">Sign in</button></p>
</form>
</section>
{% endblock %}

# PostgreSQL server settings for nzbd (ARCHITECTURE 8.1, PERFORMANCE 7.3).
# Mounted read-only into the `postgres` service (compose-example/compose.postgres.yaml) and loaded with
# `-c config_file=/etc/postgresql/postgresql.conf`. Sized for ~1M releases on a small host (container limit 2 GiB).
# The SECURITY settings below are part of the design and asserted by scripts/deploy_check.sh (static: this file;
# live: SHOW in the running server). Change the sizing freely; do not change the security block.

# ---- connections: Unix socket only -------------------------------------------------------------------
# The server has no network at all (network_mode: none); nzbd reaches it through the socket volume, mounted
# read-only into nzbd (review 30 I3). No TCP listener, so no published or reachable port.
listen_addresses = ''
port = 5432
unix_socket_directories = '/var/run/postgresql'
unix_socket_permissions = 0777        # access is decided by pg_hba.conf and by which containers mount the volume
hba_file = '/etc/postgresql/pg_hba.conf'
max_connections = 30                  # nzbd pools 8 + 2 + 2, the indexer lock connection, CLI runs, an operator psql

# ---- security (review 30 M1, M5, I3) -----------------------------------------------------------------
password_encryption = scram-sha-256   # pg_hba.conf allows scram-sha-256 and peer only
ssl = off                             # no TLS mode (D35 Q10): socket only, nothing to encrypt in transit
# Logging: Postgres prints every ERROR with its DETAIL; a CHECK violation would print the whole failing row
# (password hash, sealed TOTP secret, email, CSRF token) and a unique violation the key. None of it may reach the log.
log_destination = 'stderr'
logging_collector = off               # stderr -> docker logs (rotated by the json-file driver settings)
log_error_verbosity = terse           # no DETAIL / HINT / CONTEXT
log_min_error_statement = panic       # never the statement text
log_parameter_max_length = 0          # never bind values
log_parameter_max_length_on_error = 0
log_statement = none
log_min_duration_statement = -1       # no slow-query logging (it prints statements)
log_connections = off                 # operator choice; no secret in these lines either way
log_disconnections = off
log_line_prefix = '%m [%p] '
log_timezone = 'UTC'
shared_preload_libraries = ''         # no auto_explain, no pg_stat_statements in production

# ---- memory and I/O at ~1M releases (container limit 2 GiB) ------------------------------------------
shared_buffers = 1GB
effective_cache_size = 1536MB
work_mem = 8MB
maintenance_work_mem = 256MB
huge_pages = try
random_page_cost = 1.1                # SSD
effective_io_concurrency = 200
jit = off                             # short OLTP statements; nzbd also sets it per connection

# ---- WAL and durability ------------------------------------------------------------------------------
wal_level = replica                   # allows pg_basebackup (expert option, docs/RUNBOOK.md)
synchronous_commit = on               # required by the ingest ordering (a commit is durable before a source moves)
fsync = on
full_page_writes = on
wal_compression = zstd
max_wal_size = 2GB
min_wal_size = 256MB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9

# ---- maintenance -------------------------------------------------------------------------------------
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 30s

# ---- locale ------------------------------------------------------------------------------------------
timezone = 'UTC'

# Client authentication for nzbd's PostgreSQL (T116; docs/v3/ARCHITECTURE.md 8.1, review 30 I3).
# First match wins. The server listens on its Unix socket only (postgresql.conf), so the `host` lines are a second
# fence: any TCP attempt is rejected. No `trust`, `md5` or `password` line exists (sqlx answers whatever the server
# asks for, so cleartext is excluded here, on the server side).
# TYPE  DATABASE  USER        ADDRESS     METHOD
local   all       postgres                peer            # superuser: only from inside the postgres container (uid 999)
local   nzbd      nzbd_owner              scram-sha-256   # migrations, restore, retention: the one-shot `setup` service
local   nzbd      nzbd_app                scram-sha-256   # nzbd serve and the operator CLI
local   all       all                     reject
host    all       all         0.0.0.0/0   reject
host    all       all         ::/0        reject

# Token tables for nzb-core::scene (PARSER_SPEC §Data-driven tables).
#
# Keys are lowercase phrases of 1..=3 words; words are what the tokenizer yields after splitting
# on `. _ space - [ ] ( ) { } ,` (so "WEB-DL" is the phrase "web dl", "DD5.1" is "dd5 1").
# Values are the canonical labels. Structure (S01E02, years, dates, group suffix) is code, not data.
# Validated at load: unknown enum values, empty/oversized/non-lowercase keys, and a year bound
# that is out of range are errors; duplicate keys within a table are rejected by the TOML parser.

# Latest year accepted as a release year (callers should override with clock-derived value).
max_year = 2027

